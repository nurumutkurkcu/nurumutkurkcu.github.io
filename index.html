    <circle cx="120" cy="620" r="10" fill="#3E8579"/>
    <circle cx="220" cy="700" r="5" fill="#3E8579"/>
    <circle cx="680" cy="120" r="14" fill="#3E8579"/>

    <div class="eyebrow">Sipariş · Cari · Stok Takip Sistemi</div>
    <button id="loginTrigger" class="landing-title-trigger" title="Giriş yap" aria-label="Giriş yap">

  </div>
</div>

<div id="loginModal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>Giriş yap</h2>
    <p class="sub">Nur Umut Kürkçü Temizlik ve Hijyen sistemine erişim.</p>
    <form id="loginForm">
      <div class="field">
        <label for="username">Kullanıcı adı</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Şifre</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <p id="loginError" class="error-msg hidden"></p>
      <button type="submit" class="btn btn-primary btn-block">Giriş yap</button>
      <button type="button" id="closeModal" class="btn btn-ghost btn-block mt-4">Vazgeç</button>
    </form>
  </div>
</div>

<!-- ================= UYGULAMA ================= -->
<div id="app" class="app-shell hidden">
  <div class="mobile-topbar" id="mobileTopbar">
